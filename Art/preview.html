<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Manure Composting preview</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:896px;height:504px;overflow:hidden}
body{font-family:"Segoe UI",system-ui,sans-serif}
.scene{position:absolute;inset:0;background:center/cover url("Preview.png")}
.veil{position:absolute;inset:0;background:radial-gradient(circle at 0% 0%,var(--veil-alpha) 0%,transparent 74%)}
.copy{position:absolute;left:50px;top:54px;width:470px;color:var(--inkPrimary);text-shadow:0 3px 10px rgba(0,0,0,.75)}
h1{font-size:46px;font-weight:600;line-height:1.1;letter-spacing:0;margin:0;width:430px}
.rule{width:58px;height:3px;background:var(--accent);margin:20px 0 16px}
p{width:430px;font-size:21px;font-weight:400;line-height:1.45;margin:0}
.badge{position:absolute;right:0;top:0;width:80px;height:80px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%)}
.version{position:absolute;left:869px;top:27px;transform:translate(-50%,-50%) rotate(45deg);font-size:26px;line-height:1;font-weight:700;color:var(--badgeInk)}
</style>
<div class="scene"></div><div class="veil"></div>
<div class="copy"><h1>Manure<br>Composting</h1><div class="rule"></div><p>Turn fresh manure into biosolids.<br>Connect your barn to the soil.</p></div>
<div class="badge"></div><div class="version">1.6</div>
<script>
window.ready=fetch("preview-palette.json").then(r=>r.json()).then(async p=>{
for(const [k,v] of Object.entries(p))document.documentElement.style.setProperty("--"+k,v);
const rgb=p.veil.match(/[0-9a-f]{2}/gi).map(h=>parseInt(h,16));
document.documentElement.style.setProperty("--veil-alpha","rgba("+rgb.join(",")+",.86)");
await document.fonts.ready;
});
</script></html>
